name: MIeL monitor

# Este es el único archivo que importa en tu copia: llama al código de tinoamato/miel-monitor@v1
# con TUS Secrets. El resto de las carpetas viene con la plantilla pero no se usa.
on:
  schedule:
    # GitHub usa UTC (= hora de Argentina + 3) y puede atrasar o saltear corridas en horas pico.
    # Normal: cada 30 min de 8 a 22 h (~900 min/mes de los 2000 gratis).
    # Con la variable CRON_EXTERNO=true (README, "Avisos más rápidos") éste se saltea y dispara cron-job.org.
    - cron: "17,47 0,1,11-23 * * *"
    # Respaldo, siempre activo: hábiles 10:37 y 18:37, fines de semana 13:37.
    - cron: "37 13,21 * * 1-5"
    - cron: "37 16 * * 0,6"
  workflow_dispatch:
    inputs:
      dump:
        description: "Guardar HTML + screenshots como artifact (diagnóstico)"
        type: boolean
        default: false

# Evita dos corridas simultáneas pisándose el estado.
concurrency:
  group: miel-monitor
  cancel-in-progress: false

jobs:
  check:
    # En el repo original no hay credenciales: sólo corre en las copias.
    # Un job salteado no consume minutos.
    if: >-
      github.repository != 'tinoamato/miel-monitor' &&
      !(vars.CRON_EXTERNO == 'true' && github.event.schedule == '17,47 0,1,11-23 * * *')
    uses: tinoamato/miel-monitor/.github/workflows/run.yml@v1
    with:
      dump: ${{ inputs.dump == true }}
    secrets: inherit
